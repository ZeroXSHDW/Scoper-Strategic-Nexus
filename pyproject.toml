[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regulatory-requirements-scoper"
version = "1.1.0"
description = "Python CLI for building a regulatory requirements XLSX reference workbook and DOCX vendor questionnaire."
requires-python = ">=3.10"
dependencies = [
  "pypdf>=4.0",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "lxml>=5.0",
]

[project.scripts]
regulatory-requirements = "regulatory_requirements.cli:main"

[tool.setuptools.package-data]
regulatory_requirements = ["sources.json"]
